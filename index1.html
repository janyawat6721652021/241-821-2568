<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    @font-face {
        font-family: 'Kanit';
        src: url(./Kanit/Kanit-Regular.ttf);
    }
    body {
        background-color: #e7f1ff;
        font-family: 'Kanit';
    }
    #register-form {
        color: rgb(212, 68, 145);
        padding-left: 20px;
        margin-left: 20px;
        padding-right: 20px;
        margin-right: 20px;
        border: 2px solid #b276b9;
        text-align: center;
    }
    .form-control {
        border: 2px solid black;
        margin-bottom: 30px;
    }
</style>
    <!-- this will not show on browser webpage-->
</head>
<body>
    <!-- this will not show on browser webpage-->
     <h1 id="register-form">Register Form</h1>
     Name : <input class="form-control" type="text" name="name">
     Surname : <input class="form-control" type="text" name="surname"><br>
     Age : <input type="number" name="age" min="0" max="150"><br>
     Gender : 
     <input type="radio" name="gender" value="male"> Male
     <input type="radio" name="gender" value="female"> Female<br>
     Hobbies:
     <input type="checkbox" name="hobby" value="reading" > Readings
     <input type="checkbox" name="hobby" value="traveling" > Traveling
     <input type="checkbox" name="hobby" value="sports" > Sports<br>
     Description : <br>
     <textarea name="description" rows="4" cols="50"></textarea><br>
     <input type="submit" value="Submit"


</body>
</html>
