<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .button{
        background-color: blue;
        color: white;
        padding: 10px 20px;
       }
       .button:hover {
        background-color: rgb(45, 175, 27)
       }
       .button:active {
        background-color: rgba(255, 0, 0, 0.984);
       }
       .button:focus {
        background-color: yellow;
       }
       input:focus{
        border: 10px solid rgb(54, 5, 0);
        background-color: orange;
       }

    </style>
</head>
<body>
    <input type = "text">
<!-- :hover = วาง :active = คลิก :focus = cursor อยู่ตรง -->
    <button class="button">Click Me!</button>
</body>
</html>
