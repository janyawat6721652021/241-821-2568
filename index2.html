<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .button{
        background-color: blue;
        color: white;
        padding: 10px 20px;
       }
       .button:hover {
        background-color: rgb(45, 175, 27)
       }
       .button:active {
        background-color: rgba(255, 0, 0, 0.984);
       }
       .button:focus {
        background-color: yellow;
       }
       input:focus{
        border: 10px solid rgb(54, 5, 0);
        background-color: orange;
       }
.container .item {
            background-color: lightblue;
        }
        .button {
            background-color: rgb(155, 255, 54);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button.active {
            background-color: blue;
        }
        .button.warning {
            background-color: red;
        }
    </style>
</head>
<body>
      <div class="container">
    Container content
        <div class="item">
            Item Content
        </div>
    </div>
     <div class="footer-container">
        Container content
        <div class="item">
            Item Content
        </div>
    </div>
    <button class="button">Click Me</button>
    <button class="button active">Delete</button>
    <button class="button warning">Warning</button>
    <input type = "text">
<!-- :hover = วาง :active = คลิก :focus = cursor อยู่ตรง -->
    <button class="button">Click Me!</button>
</body>

</html>
